spring:
  application:
    name: Duelo64 API

  servlet:
    multipart:
      max-file-size: 2MB
      max-request-size: 3MB

  config:
    import: optional:file:.env[.properties]

  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/duelo64}
    username: ${DATABASE_USERNAME:duelo64}
    password: ${DATABASE_PASSWORD:duelo64}

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC

  flyway:
    enabled: true

server:
  port: ${PORT:${SERVER_PORT:8080}}
  forward-headers-strategy: framework

management:
  endpoints:
    web:
      exposure:
        include: health,info
